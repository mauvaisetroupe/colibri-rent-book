# PostgreSQL in Docker for development and tests (the production composition is in the operations repository).
#
# Disposable database for the automated tests:
#   npm run db:up          start it (empty, in memory)
#   npm run test:local     run the tests against it (they load the migrations, and TEST_SEED_FILES when given)
#   npm run db:down        stop everything
#
# Development database:
#   npm run db:local       start it with Adminer, then the migration image (migrations/Dockerfile, Flyway), as in
#                          production (ADR 0026); the data and extractors of an operation are loaded by its own
#                          scripts, or typed in the application
#   npm run dev            run the API against it (backend/.env.local)
#   npm run db:local:reset recreate it from scratch (deletes its data)

name: colibri

services:
  # Tests: in memory, recreated by each test run
  test-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: colibri_test
    ports:
      - '127.0.0.1:55442:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'colibri_test']
      interval: 2s
      timeout: 5s
      retries: 15

  # Development: persistent volume
  dev-db:
    image: postgres:18
    environment:
      POSTGRES_USER: colibri
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: colibri
    ports:
      - '127.0.0.1:55443:5432'
    volumes:
      - dev-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'colibri', '-d', 'colibri']
      interval: 2s
      timeout: 5s
      retries: 15

  # The migration image, built from this folder; run by « docker compose run » (npm run db:local), which waits for it
  dev-migrations:
    build: ./migrations
    profiles: [migrations]
    environment:
      FLYWAY_URL: jdbc:postgresql://dev-db:5432/colibri
      FLYWAY_USER: colibri
      FLYWAY_PASSWORD: dev
    depends_on:
      dev-db:
        condition: service_healthy

  # Web interface for the databases: http://localhost:8090
  adminer:
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: dev-db
    ports:
      - '127.0.0.1:8090:8080'
    depends_on:
      - dev-db

volumes:
  dev-db-data:
