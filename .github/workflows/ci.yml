name: CI

on:
  push:
    branches: [main]
    # Versions (ADR 0026): v1.0.0 publishes the images 1.0.0 and 1.0, and the release notes
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: colibri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/colibri_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # The tests of the minutes read the text of the PDF (pdftotext)
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci --no-audit
      - run: npx tsc --noEmit
      # The migration image on an empty database, as in production (ADR 0026), then run again: nothing to do. The tests
      # recreate their schema afterwards
      - run: docker build -t colibri-rent-book-migrations migrations
      - run: |
          for command in migrate migrate info; do
            docker run --rm --network host -e FLYWAY_URL=jdbc:postgresql://localhost:5432/colibri_test \
              -e FLYWAY_USER=postgres -e FLYWAY_PASSWORD=test colibri-rent-book-migrations $command
          done
      - run: npm test

  frontend:
    name: Frontend build and extraction engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      - run: npm run build
      - run: npm test

  # Public images (ADR 0026, docs/exploitation.md), published once the tests pass: the commit (short) for every push to
  # main, X.Y.Z and X.Y for a tag vX.Y.Z. No latest: the operator picks a version
  images:
    name: Publish image (${{ matrix.image }})
    needs: [secrets, backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: colibri-rent-book
            context: .
            file: Dockerfile
            platforms: linux/amd64
            description: Colibri rent book, API and interface. Requires the colibri-rent-book-migrations image of the same version.
          # Nothing run while it is built: both platforms without emulation
          - image: colibri-rent-book-migrations
            context: backend/migrations
            file: backend/migrations/Dockerfile
            platforms: linux/amd64,linux/arm64
            description: Colibri rent book database migrations (Flyway). Run before the colibri-rent-book image of the same version.
    env:
      # GHCR shows the description of the index of a multi-platform image
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@v5
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=,format=short
            type=match,pattern=^v(\d+\.\d+\.\d+)$,group=1
            type=match,pattern=^v(\d+\.\d+)\.\d+$,group=1
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          # Shown in the interface and by /api/health: X.Y.Z for a tag, the commit otherwise
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # GitHub Release of a version, its notes written from git (.github/release-notes.sh): what the operator must read
  # (commits marked « ! »), the new migrations, the commits since the previous version
  release:
    name: Release notes
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history and the tags: the previous version
          fetch-depth: 0
      - run: .github/release-notes.sh "$GITHUB_REF_NAME" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "Colibri ${GITHUB_REF_NAME#v}"
          --notes-file notes.md
          --verify-tag
